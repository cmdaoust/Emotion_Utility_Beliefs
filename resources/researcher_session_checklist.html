<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Emotion Utility Beliefs Session Checklist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Code+Pro:wght@400;500&display=swap">
<style>
/* Layout: sticky header with progress, left section rail on wide screens, one column of tickable steps.
   Single deliberate light look to match the participant ECG slideshow (clinical teal, square boxes). */
:root {
  color-scheme: light;
  --bg: #f4f8f8;
  --paper: #ffffff;
  --ink: #1d2b2f;
  --muted: #4f6569;
  --teal: #0f4c5c;
  --teal-2: #2a9d8f;
  --mint: #5fd3c4;
  --soft: #eaf4f3;
  --key: #e1f0ee;
  --line: #cfe2df;
  --good: #2e8b57;
  --bad: #b3261e;
  --todo-bg: #fff4d6;
  --todo-line: #c98a00;
  --todo-ink: #6b4a00;
  --font: "Source Sans 3", "Source Sans Pro", "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "Source Code Pro", Consolas, "Courier New", monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--font);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--teal); }
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--teal); color: #fff;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 18px; margin-right: auto; }
.meter { display: flex; align-items: center; gap: 10px; font-size: 15px; font-variant-numeric: tabular-nums; }
.meter-track { width: 160px; height: 8px; background: rgba(255,255,255,.2); }
.meter-fill { height: 100%; width: 0; background: var(--mint); transition: width .25s ease; }
.btn {
  font: 600 15px var(--font); padding: 7px 14px; border: 1px solid rgba(255,255,255,.5); background: transparent; color: #fff; cursor: pointer;
}
.btn:hover { background: rgba(255,255,255,.12); }
.btn.armed { background: #fff; color: var(--bad); border-color: #fff; }
.btn:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }

.page {
  max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 36px;
  padding-block: 28px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
nav.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); align-self: start; display: flex; flex-direction: column; gap: 2px; font-size: 15px; }
@media (max-width: 860px) { .page { grid-template-columns: minmax(0, 1fr); } nav.rail { display: none; } .meter-track { width: 100px; } }
nav.rail a { color: var(--muted); text-decoration: none; padding: 6px 10px; border-left: 3px solid var(--line); display: flex; gap: 8px; }
nav.rail a:hover { color: var(--teal); border-left-color: var(--teal-2); }
nav.rail a .n { font-variant-numeric: tabular-nums; color: var(--teal-2); font-weight: 700; min-width: 1.4em; }
nav.rail a.complete { color: var(--good); border-left-color: var(--good); }
nav.rail a.complete .n::after { content: " \2713"; }

main { min-width: 0; display: flex; flex-direction: column; gap: 40px; }
.intro h1 { margin: 0 0 6px; font-size: 34px; line-height: 1.15; color: var(--teal); text-wrap: balance; }
.intro p { margin: 0 0 10px; max-width: 70ch; }
.intro .meta { color: var(--muted); font-size: 15px; }
.links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.links a { background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--teal-2); padding: 8px 14px; color: var(--teal); font-weight: 600; text-decoration: none; }
.links a:hover { border-color: var(--teal-2); }

.todo-banner { background: var(--todo-bg); border-left: 6px solid var(--todo-line); padding: 12px 16px; color: var(--todo-ink); font-size: 15px; }
.todo { display: inline-block; background: var(--todo-bg); border: 1px dashed var(--todo-line); color: var(--todo-ink); padding: 0 6px; font-size: .92em; font-weight: 600; }
.todo::before { content: "To fill in: "; font-weight: 700; }

section.sec { scroll-margin-top: 80px; }
@media (max-width: 860px) { section.sec { scroll-margin-top: 140px; } }
.sec-head { display: flex; align-items: baseline; gap: 12px; border-bottom: 2px solid var(--teal); padding-bottom: 8px; margin-bottom: 4px; }
.sec-num { font-weight: 700; color: var(--teal-2); font-size: 18px; font-variant-numeric: tabular-nums; }
.sec-head h2 { margin: 0; font-size: 26px; color: var(--teal); text-wrap: balance; }
.sec-count { margin-left: auto; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
section.complete .sec-head { border-bottom-color: var(--good); }
section.complete .sec-count { color: var(--good); font-weight: 700; }
.sec-lede { color: var(--muted); margin: 8px 0 0; max-width: 70ch; }

ol.steps { list-style: none; margin: 0; padding: 0; }
.step { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.step input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--good); cursor: pointer; }
.step label { font-weight: 700; font-size: 18px; cursor: pointer; }
.step.checked label { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--good); }
.step.checked .detail { opacity: .6; }
.step.missed { background: #fdecea; box-shadow: -10px 0 0 #fdecea, 10px 0 0 #fdecea; }
.step.flash { animation: flash 1.2s ease; }
@keyframes flash { 0% { background: var(--key); } 100% { background: transparent; } }
.detail { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; min-width: 0; }
.detail p { margin: 0; max-width: 72ch; }
.detail ol, .detail ul { margin: 0; padding-left: 1.3em; max-width: 72ch; }
.detail li + li { margin-top: 3px; }

.script { background: var(--soft); border-left: 4px solid var(--teal); padding: 10px 14px; font-style: italic; max-width: 72ch; }
.script::before { content: "Say"; display: block; font-style: normal; font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--teal-2); margin-bottom: 2px; }
.callout { background: var(--key); padding: 10px 14px; max-width: 72ch; margin: 0; }
.critical { border: 3px solid var(--bad); background: #fdecea; padding: 14px 16px 14px 60px; position: relative; max-width: 72ch; margin: 0; }
.critical::before { content: "!"; position: absolute; left: 14px; top: 14px; width: 32px; height: 32px; background: var(--bad); color: #fff; font-weight: 700; font-size: 22px; display: grid; place-items: center; border-radius: 50%; }
.critical b.head { display: block; color: var(--bad); font-size: 18px; margin-bottom: 4px; }
.step.crit-step { background: #fff7f6; box-shadow: -10px 0 0 #fff7f6, 10px 0 0 #fff7f6; border-left: 6px solid var(--bad); padding-left: 10px; }
.step.crit-step > .body > label { color: var(--bad); font-size: 20px; }
.id-banner { border: 3px solid var(--bad); background: #fdecea; padding: 14px 18px; }
.id-banner b.head { display: block; color: var(--bad); font-size: 20px; margin-bottom: 4px; }
.callout.warn { background: #fdecea; border-left: 4px solid var(--bad); }
.code { position: relative; background: #0f2a30; color: #e6f4f1; max-width: 100%; }
.code pre { margin: 0; padding: 10px 76px 10px 14px; font: 14px/1.5 var(--mono); overflow-x: auto; white-space: pre; }
.copy { position: absolute; top: 6px; right: 6px; font: 600 13px var(--font); background: var(--teal-2); color: #fff; border: 0; padding: 4px 10px; cursor: pointer; }
.path { font-family: var(--mono); font-size: .9em; background: var(--soft); padding: 0 4px; }
kbd { font-family: var(--mono); font-size: .85em; border: 1px solid var(--line); border-bottom-width: 2px; padding: 0 5px; background: #fff; }

figure.shot { margin: 4px 0; max-width: 560px; }
figure.shot.wide { max-width: 720px; }
figure.shot.small { max-width: 220px; }
.kitrow { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
.kitrow figure.shot { margin: 0; max-width: none; width: auto; }
.kitrow figure.shot img { height: 170px; width: auto; max-width: 100%; }
figure.shot.mid { max-width: 360px; }
figure.shot.mark { position: relative; }
figure.shot.mark img { border-width: 5px; border-style: solid; }
figure.shot.mark.good img { border-color: var(--good); }
figure.shot.mark.bad img { border-color: var(--bad); }
figure.shot.mark::after { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 24px; line-height: 1; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
figure.shot.mark.good::after { content: "\2713"; background: var(--good); }
figure.shot.mark.bad::after { content: "\2717"; background: var(--bad); }
.kitrow.tall { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 230px)); align-items: start; }
.kitrow.tall figure.shot img { height: auto; width: 100%; }
figure.shot img { display: block; width: 100%; height: auto; border: 1px solid var(--line); }
figure.shot figcaption { font-size: 14px; color: var(--muted); margin-top: 4px; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; max-width: 760px; }
@media (max-width: 600px) { .pair { grid-template-columns: minmax(0, 1fr); } }

details.trouble, details.tip { border: 1px solid var(--line); background: var(--paper); max-width: 72ch; }
details.trouble > summary, details.tip > summary { cursor: pointer; padding: 8px 12px; font-weight: 600; color: var(--teal); list-style: none; display: flex; gap: 8px; align-items: center; }
details > summary::-webkit-details-marker { display: none; }
details.trouble > summary::before { content: "!"; display: grid; place-items: center; width: 20px; height: 20px; background: var(--bad); color: #fff; font-size: 13px; font-weight: 700; flex: none; }
details.tip > summary::before { content: "i"; display: grid; place-items: center; width: 20px; height: 20px; background: var(--teal-2); color: #fff; font-size: 13px; font-weight: 700; font-style: italic; flex: none; }
details[open] > summary { border-bottom: 1px solid var(--line); }
.trouble-body, details.tip > div { padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }

.leads { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.dot { display: inline-block; width: .8em; height: .8em; border-radius: 50%; vertical-align: -.05em; margin-right: .3em; border: 2px solid #333; }
.dot.w { background: #fff; } .dot.k { background: #222; } .dot.r { background: #e0123f; border-color: #e0123f; }

.sec-foot { display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding-top: 14px; flex-wrap: wrap; }
.sec-msg { color: var(--good); font-weight: 600; }
.done-btn { font: 600 15px var(--font); padding: 8px 16px; background: var(--teal); color: #fff; border: 0; cursor: pointer; }
.done-btn:hover { background: #0b3a47; }

#modal { position: fixed; inset: 0; background: rgba(8, 30, 35, .55); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal-box { background: var(--paper); max-width: 480px; width: 100%; padding: 22px 24px; border-top: 6px solid var(--bad); }
.modal-box h3 { margin: 0 0 6px; color: var(--bad); }
.modal-box p { margin: 0 0 12px; }
#modalList { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
#modalList button { width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 10px; font: 600 15px var(--font); padding: 9px 12px; background: var(--soft); border: 1px solid var(--line); color: var(--ink); cursor: pointer; }
#modalList button span { color: var(--teal-2); white-space: nowrap; }
#modalClose { font: 600 15px var(--font); padding: 7px 14px; background: transparent; border: 1px solid var(--line); cursor: pointer; color: var(--ink); }

@media (prefers-reduced-motion: reduce) { .meter-fill { transition: none; } .step.flash { animation: none; } }
</style>

<header class="top">
  <div class="top-in">
    <span class="brand">Emotion Utility Beliefs</span>
    <div class="meter"><div class="meter-track"><div class="meter-fill" id="meterFill"></div></div><span id="meterCount">0 / 0 steps</span></div>
    <button class="btn" id="resetBtn" type="button">Reset for next participant</button>
  </div>
</header>

<div class="page">
  <nav class="rail" id="nav" aria-label="Sections"></nav>
  <main>
    <div class="intro">
      <h1>Session checklist</h1>
      <p>Work through each step in order and tick it off as you go. Press the button at the end of each section to check you haven't missed anything.</p>
      <div class="links">
        <a href="https://claude.ai/artifact/MQKaDFXqA3X8kisoPimzgg" target="_blank" rel="noopener">Participant ECG slideshow</a>
      </div>
    </div>
    <div class="todo-banner" id="todoBanner"></div>
    <div id="sections"></div>
  </main>
</div>

<div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-box">
    <h3 id="modalTitle">You missed a step</h3>
    <p id="modalText"></p>
    <ul id="modalList"></ul>
    <button id="modalClose" type="button">Close</button>
  </div>
</div>

<script>
const IMG = {
  ecgRec: "images/checklist/ecgRec.png",
  edaPlace: "images/checklist/edaPlace.jpg",
  edaFlat: "images/checklist/edaFlat.jpg",
  edaStepped: "images/checklist/edaStepped.jpg",
  edaSteppedData: "images/checklist/edaSteppedData.jpg",
  edaSCR: "images/checklist/edaSCR.jpg",
  ecgElectrode: "images/checklist/ecgElectrode.jpg",
  edaSheet: "images/checklist/edaSheet.jpg",
  isoGel: "images/checklist/isoGel.jpg",
  spectraGel: "images/checklist/spectraGel.jpg",
  bslShortcut: "images/checklist/bslShortcut.jpg",
  bslWizard: "images/checklist/bslWizard.png",
  bslStart: "images/checklist/bslStart.png",
  bslStop: "images/checklist/bslStop.png",
  bslSaveAs: "images/checklist/bslSaveAs.png",
  bslShowAll: "images/checklist/bslShowAll.png",
  bslAutoscale: "images/checklist/bslAutoscale.png",
  trim1: "images/checklist/trim1.jpg",
  trim2: "images/checklist/trim2.jpg",
  trim3: "images/checklist/trim3.jpg",
  trim4: "images/checklist/trim4.jpg",
  lockboxRoom: "images/checklist/lockboxRoom.jpg",
  lockboxKeys: "images/checklist/lockboxKeys.jpg",
  mp36Unit: "images/checklist/mp36Unit.jpg",
  mp36Switch: "images/checklist/mp36Switch.jpg",
  ecgCroc: "images/checklist/ecgCroc.jpg",
  leadHooks: "images/checklist/leadHooks.jpg",
  keyA5: "images/checklist/keyA5.jpg",
  keyA4: "images/checklist/keyA4.jpg",
  stimPC: "images/checklist/stimPC.jpg",
  biopacPC: "images/checklist/biopacPC.jpg",
  clipRight: "images/checklist/clipRight.jpg",
  clipWrong: "images/checklist/clipWrong.jpg"
,  ecgUnder: "images/checklist/ecgUnder.jpg",
  roomA4Box: "images/checklist/roomA4Box.jpg",
  ecgRefill: "images/checklist/ecgRefill.jpg",
  edaRefill: "images/checklist/edaRefill.jpg",
  boxShortcut: "images/checklist/boxShortcut.jpg"
};
const p = t => `<p>${t}</p>`;
const s = t => `<div class="script">${t}</div>`;
const todo = t => `<span class="todo">${t}</span>`;
const crit = (head, t) => `<div class="critical"><b class="head">${head}</b>${t}</div>`;
const call = (t, cls = "") => `<p class="callout ${cls}">${t}</p>`;
const code = t => `<div class="code"><pre>${t.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</pre><button class="copy" type="button">Copy</button></div>`;
const fig = (key, cap, cls = "") => `<figure class="shot ${cls}"><img src="${IMG[key]}" alt="${cap}"><figcaption>${cap}</figcaption></figure>`;
const trouble = (title, body) => `<details class="trouble"><summary>${title}</summary><div class="trouble-body">${body}</div></details>`;
const tip = (title, body) => `<details class="tip"><summary>${title}</summary><div>${body}</div></details>`;
const W = '<span class="dot w"></span>', K = '<span class="dot k"></span>', R = '<span class="dot r"></span>';

const SECTIONS = [
  { id: "kit", title: "Before the participant arrives", lede: "Get the room and equipment ready. Allow 15 minutes.", steps: [
    ["Unlock the testing room", p("Collect the room key from the <b>black lockbox</b>, using the lockbox code you have been given, and unlock testing room <b>A5</b>.") + p("The room keys are the bunch on the clip at the bottom of the lockbox.") + `<div class="kitrow tall">` + fig("lockboxRoom", "The black lockbox (circled), on the wall seen from the doorway") + fig("lockboxKeys", "The room keys (circled), at the bottom of the lockbox") + `</div>` + p("The testing room key has a <b>blue dot</b>.") + `<div class="kitrow tall">` + fig("keyA4", "Testing room (A5) key: blue dot") + fig("keyA5", "Room A4 key: red dot") + `</div>`],
    ["Tidy the room", p("Make sure nothing is left over from the last session (paper, used electrodes, wipes).")],
    ["Check you have the ECG supplies", `<ul><li>3 round ECG electrodes per participant, plus spares</li><li><b>Spectra 360</b> electrode gel (for ECG only)</li><li>ECG lead with <b>three</b> wires: ${W}white, ${K}black, ${R}red (SS2L)</li></ul>` + `<div class="kitrow">` + fig("ecgElectrode", "A round ECG electrode (metal stud side up)", "small") + fig("spectraGel", "Spectra 360 gel (blue tube): for ECG only", "small") + `</div>` + tip("Running out of electrodes?", p("Spare ECG electrodes are stored in <b>room A4</b> (the key with the <b>red dot</b>), in the box under the desk. Collect a new packet and bring it back to the testing room.") + `<div class=\"kitrow tall\">` + fig("roomA4Box", "The electrode box under the desk in room A4 (circled)") + fig("ecgRefill", "ECG electrode packets are labelled EL503") + `</div>`)],
    ["Check you have the EDA supplies", `<ul><li>2 EDA electrodes per participant, plus spares</li><li><b>Isotonic gel</b> (GEL101A) for EDA only</li><li>EDA lead with <b>two</b> wires: ${R}red and ${K}black (SS57L)</li><li>Medical tape</li></ul>` + call("Never swap the gels. Spectra 360 isn't made for skin conductance, so using it on the EDA electrodes changes the readings.", "warn") + `<div class="kitrow">` + fig("edaSheet", "A sheet of EDA electrodes", "mid") + fig("isoGel", "Isotonic gel (GEL101A): for EDA only", "small") + `</div>` + tip("Running out of electrodes?", p("Spare electrodes are stored in <b>room A4</b> (the key with the <b>red dot</b>), in the box under the desk. Collect a new packet and bring it back to the testing room.") + `<div class=\"kitrow tall\">` + fig("roomA4Box", "The electrode box under the desk in room A4 (circled)") + fig("edaRefill", "EDA electrode packets are labelled EL507 / GSR-13") + `</div>`)],
    ["Check you have wipes and a bin", p("Water-based wet wipes and tissues for the end of the session.")],
    ["Collect what you need from room S5", p("From room <b>S5</b>, collect:") + `<ul><li>a <b>debrief sheet</b></li><li><b>£1</b> for the participant</li><li>the <b>payment sheet</b> participants sign to show they received their money</li><li>the <b>attendance form</b></li></ul>`],
    ["Prepare the 3 ECG electrodes", p("Participants are given the ECG electrodes <b>ready to stick on</b>, so do this now:") + `<ol><li>Peel the backing off each of the 3 ECG electrodes.</li><li>Check the gel in the middle isn't dry.</li><li>If it is dry, add a <b>small drop of Spectra 360</b>.</li><li>Lay them gel side up on a clean surface, ready to hand over.</li></ol>` + `<div class="kitrow">` + fig("ecgElectrode", "ECG electrode", "small") + fig("spectraGel", "Spectra 360 (blue tube): ECG only", "small") + `</div>`]
  ]},
  { id: "stim", title: "Stimulus PC", lede: "This is the computer the participant uses. It runs the PsychoPy experiment and the Qualtrics forms.", steps: [
    ["Put the participant ID post-it in view", p("Take the post-it explaining how to make the participant ID from next to the Biopac PC, and stick it on the Stimulus PC where the participant can <b>clearly see it</b>.")],
    ["Turn on the Stimulus PC and log in", p("Log in to the <b>Lab</b> account. You'll be given the password separately.") + fig("stimPC", "The Stimulus PC, where the participant sits", "mid")],
    ["Set the volume", p("Set the system volume to <b>15</b>. The experiment starts with its own volume check, so the participant can adjust from there.")],
    ["Open the PsychoPy experiment", p("Double-click the PsychoPy experiment shortcut on the desktop. It opens the experiment in PsychoPy Builder.") + call("Never edit the experiment on this computer. If PsychoPy asks to save changes when you close it, choose <b>Don't save</b>.")],
    ["Open the information and consent form", p("Double-click the <b>INFO &amp; CONSENT - EmoUtilityBelief</b> shortcut on the desktop. It opens the form in Qualtrics. Leave it on the first page.")],
    ["Open the demographics form", p("Double-click the <b>DEMOGRAPHICS - EmoUtilityBelief</b> shortcut on the desktop.") + p("Then switch back to the information and consent form, so that's what the participant sees first.")]
  ]},
  { id: "biopac", title: "Biopac PC and MP36", lede: "This computer records the physiology.", steps: [
    ["Turn on the Biopac PC and log in", p("Log in to the <b>cm909</b> account. You'll be given the password separately.") + fig("biopacPC", "The Biopac PC", "mid")],
    ["Turn on the MP36", p("Switch it on with the power switch on the back. The status light on the front should come on.") + `<div class="kitrow tall">` + fig("mp36Unit", "The MP36 (blue unit), next to the PC tower") + fig("mp36Switch", "The power switch (circled) on the back of the MP36") + `</div>`],

const KEY = "eub-session-checklist-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { state = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

const root = document.getElementById("sections");
const nav = document.getElementById("nav");
let total = 0;
root.style.display = "flex"; root.style.flexDirection = "column"; root.style.gap = "44px";

SECTIONS.forEach((sec, si) => {
  const el = document.createElement("section");
  el.id = sec.id; el.className = "sec";
  const num = String(si + 1).padStart(2, "0");
  el.innerHTML = `<div class="sec-head"><span class="sec-num">${num}</span><h2>${sec.title}</h2><span class="sec-count"></span></div>${sec.lede ? `<p class="sec-lede">${sec.lede}</p>` : ""}<ol class="steps"></ol>`;
  const list = el.querySelector("ol");
  sec.steps.forEach(([action, detail, cls], i) => {
    const id = `${sec.id}-${i}`;
    total++;
    const li = document.createElement("li");
    li.className = "step" + (cls ? " " + cls : "");
    li.innerHTML = `<input type="checkbox" id="${id}"><div class="body"><label for="${id}">${action}</label>${detail ? `<div class="detail">${detail}</div>` : ""}</div>`;
    const cb = li.querySelector("input");
    cb.checked = !!state[id];
    li.classList.toggle("checked", cb.checked);
    cb.addEventListener("change", () => {
      if (cb.checked) state[id] = 1; else delete state[id];
      li.classList.toggle("checked", cb.checked);
      if (cb.checked) li.classList.remove("missed");
      save(); update();
    });
    list.appendChild(li);
  });
  const foot = document.createElement("div");
  foot.className = "sec-foot";
  foot.innerHTML = `<span class="sec-msg" aria-live="polite"></span><button class="done-btn" type="button">Finish: ${sec.title}</button>`;
  foot.querySelector("button").addEventListener("click", () => finishSection(si));
  el.appendChild(foot);
  root.appendChild(el);
  const a = document.createElement("a");
  a.href = "#" + sec.id; a.dataset.sec = sec.id;
  a.innerHTML = `<span class="n">${si + 1}</span><span>${sec.title}</span>`;
  nav.appendChild(a);
});

const todoCount = document.querySelectorAll("#sections .todo").length;
const banner = document.getElementById("todoBanner");
if (todoCount) banner.innerHTML = `<b>Draft:</b> ${todoCount} lab-specific details still need filling in. They're marked <span class="todo">like this</span>.`;
else banner.hidden = true;

const modal = document.getElementById("modal");
let lastFocus = null;
function closeModal() { modal.hidden = true; if (lastFocus) lastFocus.focus(); }
document.getElementById("modalClose").addEventListener("click", closeModal);
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !modal.hidden) closeModal(); });
const smooth = () => matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";

function goToStep(li) {
  modal.hidden = true;
  li.scrollIntoView({ behavior: smooth(), block: "center" });
  li.classList.remove("flash"); void li.offsetWidth; li.classList.add("flash");
  li.querySelector("input").focus({ preventScroll: true });
}

function finishSection(si) {
  const sec = SECTIONS[si];
  const el = document.getElementById(sec.id);
  const steps = [...el.querySelectorAll(".step")];
  const missed = steps.filter(li => !li.querySelector("input").checked);
  steps.forEach(li => li.classList.toggle("missed", missed.includes(li)));
  const msg = el.querySelector(".sec-msg");
  if (missed.length === 0) {
    const next = SECTIONS[si + 1];
    msg.textContent = next ? "Section complete. Moving on…" : "All done. Well done!";
    if (next) setTimeout(() => { document.getElementById(next.id).scrollIntoView({ behavior: smooth() }); msg.textContent = "Section complete"; }, 700);
    return;
  }
  msg.textContent = "";
  lastFocus = document.activeElement;
  document.getElementById("modalTitle").textContent = missed.length === 1 ? "You missed a step" : `You missed ${missed.length} steps`;
  document.getElementById("modalText").textContent = `Finish these steps in “${sec.title}” before moving on:`;
  const list = document.getElementById("modalList");
  list.innerHTML = "";
  missed.forEach(li => {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = `${li.querySelector("label").textContent}<span>Go to step →</span>`;
    b.addEventListener("click", () => goToStep(li));
    const item = document.createElement("li");
    item.appendChild(b);
    list.appendChild(item);
  });
  modal.hidden = false;
  list.querySelector("button").focus();
}

function update() {
  let done = 0;
  SECTIONS.forEach(sec => {
    const el = document.getElementById(sec.id);
    const boxes = el.querySelectorAll(".step input");
    const n = [...boxes].filter(b => b.checked).length;
    done += n;
    const complete = n === boxes.length;
    el.querySelector(".sec-count").textContent = `${n} / ${boxes.length}`;
    el.classList.toggle("complete", complete);
    nav.querySelector(`[data-sec="${sec.id}"]`).classList.toggle("complete", complete);
  });
  document.getElementById("meterFill").style.width = (done / total * 100) + "%";
  document.getElementById("meterCount").textContent = `${done} / ${total} steps`;
}
update();

document.addEventListener("click", e => {
  const btn = e.target.closest(".copy");
  if (!btn) return;
  const pre = btn.parentElement.querySelector("pre");
  const done = msg => { btn.textContent = msg; setTimeout(() => btn.textContent = "Copy", 1500); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); done("Selected"); };
  try { navigator.clipboard.writeText(pre.textContent).then(() => done("Copied"), fallback); } catch (err) { fallback(); }
});

const resetBtn = document.getElementById("resetBtn");
let armTimer;
resetBtn.addEventListener("click", () => {
  if (!resetBtn.classList.contains("armed")) {
    resetBtn.classList.add("armed");
    resetBtn.textContent = "Click again to clear all ticks";
    armTimer = setTimeout(() => { resetBtn.classList.remove("armed"); resetBtn.textContent = "Reset for next participant"; }, 4000);
    return;
  }
  clearTimeout(armTimer);
  state = {}; save();
  document.querySelectorAll(".step input").forEach(cb => { cb.checked = false; cb.closest(".step").classList.remove("checked", "missed"); });
  document.querySelectorAll(".sec-msg").forEach(m => m.textContent = "");
  resetBtn.classList.remove("armed");
  resetBtn.textContent = "Cleared";
  setTimeout(() => resetBtn.textContent = "Reset for next participant", 1500);
  update();
  window.scrollTo({ top: 0 });
});
</script>

</body></html>
